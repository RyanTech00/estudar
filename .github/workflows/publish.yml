name: Stage on npm

# Publishing a GitHub release stages that version on npm (npm stage publish).
# It only goes live after a maintainer approves it with 2FA, on npmjs.com or with
# `npm stage approve <id>`. Auth is npm Trusted Publishing (OIDC): no token is stored here.
# OIDC tokens can stage but never approve, so a compromised workflow can't publish on its own.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm stage publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm 11.15.0+; the npm bundled with Node may be older. Exact version: nothing
      # unreviewed runs in the job that holds the publishing credential.
      - run: npm install -g npm@11.20.0

      - name: Tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}"
            exit 1
          fi
          if npm view "estudar@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::estudar@${VERSION} is already on npm — bump the version first"
            exit 1
          fi

      # --ignore-scripts: no dependency install script runs next to the OIDC token (the tests don't need any).
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm stage publish --ignore-scripts
